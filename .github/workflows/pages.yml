name: Publish Bep Nuc demo to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["bep-nuc/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bep-nuc/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: bep-nuc
      - run: npm test
        working-directory: bep-nuc
      - run: npm run build:pages
        working-directory: bep-nuc
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: bep-nuc/pages-site/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
